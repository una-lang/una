# cargo nextest configuration (the harness runs the `tests` gate with it; `cargo test --workspace --locked` stays valid).
#
# Setup: under nextest every test is a process, and each test that links natively runs `cargo build -p una-rt`,
# which rewrites target/debug/libuna_rt.a under the tests that read it. The setup script builds the library once
# and sets UNA_RT_PREBUILT, which those tests honor by not building it again.
#
# Timing: tests that compare wall-clock readings (scaling and constant-time checks, deadlines, the limiter and
# virtual-time checks) run alone: `threads-required = "num-cpus"` reserves every slot, so no other test of this
# run runs beside them. Processes outside this run still add load; keep builders and other gates away while a
# gate runs. No test is skipped and no assertion is changed.
#
# Order: a test that reserves every slot waits until every running test has finished, and nothing else starts
# meanwhile, so an exclusive test in the middle of the run leaves the slots idle while the pool drains. The
# exclusive tests therefore run first (`priority = 100`), one after another on an idle pool, and the other tests
# then fill every slot (#1695: the full run went from 1,720 s to 998 s on this machine, the same 9,843 tests passing).
#
# A scaling test that measures the processor time of the children it runs (`una` or a built executable) rather
# than the wall clock holds `cpu_time` in its name and is left out (#1656): a child's user and system time stay
# what its work costs when other tests run beside it. A test whose work runs in its own process runs it in a
# child of its test binary and reads that child's time (#1662, `cpu::in_child`).
#
# The longest tests outside the exclusive group, una-rt's FFI scenario (about 80 s) and the serve section's
# scaling test (about 30 s alone, longer beside others), start as soon as the exclusive tests have run
# (`priority = 90`), so that neither ends the run alone (#1662).

experimental = ["setup-scripts"]

[scripts.setup.runtime]
command = 'sh -c "cargo build --locked --quiet -p una-rt && echo UNA_RT_PREBUILT=1 >> $NEXTEST_ENV"'

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.scripts]]
filter = 'all()'
setup = 'runtime'

[[profile.default.overrides]]
# The tests generated one per case (#1652) are named after their case's path, which may hold one of these
# words (`case::runtime__limiter_acquire`); none of them compares wall-clock readings, so they are left out.
filter = '(test(/scale|scaling|linear|n_log_n|bounded_share|limiter|virtual_time|cube|cubic|constant_time|cost_the_same|does_not_depend|whatever_the|no_real_time|meets?_the_deadline/) | binary(/scaling/) | binary(lsp)) & !test(/^(case|interpreter|linkers|determinism|core_ir)::/) & !test(/cpu_time/)'
threads-required = "num-cpus"
priority = 100
slow-timeout = { period = "120s", terminate-after = 30 }

[[profile.default.overrides]]
filter = '(package(una-rt) & test(=ffi::tests::every_entry_point_takes_any_word_in_a_run)) | (binary_id(una-cli::serve_runs) & test(=a_serve_section_takes_constant_cpu_time_per_request))'
priority = 90
