# The fuzz targets of the native runtime (#766, the `sanitize` release gate), of the readers of
# the package manager's documents (#997): the provenance, the archive and `ita.lock`, of the
# parsers of the documents a package registry serves (ADR 0122), and of the internal linker's
# ELF reader and relocation engine (ADR 0124 rules 24 and 33, step 4b). Outside the
# workspace: its own `[workspace]` and Cargo.lock, so the workspace's stable builds never see
# it. scripts/sanitize.sh and scripts/fuzz-smoke.sh build it with the checking toolchain of
# scripts/check-toolchain.toml and the flags of scripts/fuzz-targets.sh (libFuzzer's coverage,
# AddressSanitizer and `--cfg una_fuzz`), and run each target.
[package]
name = "una-rt-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
# libFuzzer, whose C++ sources the crate vendors and builds (Apache-2.0 WITH LLVM-exception).
libfuzzer-sys = "=0.4.13"
una-core = { path = "../crates/una-core" }
# The readers of the package manager's documents and the parsers of the documents a registry
# serves (ADR 0122 rules 29 to 39), in pure Rust.
una-project = { path = "../crates/una-project" }
# The decoded entry of the project-file readers, `SourceFile`, which every command uses (#2282).
una-syntax = { path = "../crates/una-syntax" }
# Signs fuzzed documents with fixed test keys, so the targets reach past the signatures.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
una-rt = { path = "../crates/una-rt" }
# The internal linker: its ELF reader and relocation engine, in safe Rust, on any bytes.
una-link = { path = "../crates/una-link" }

[[bin]]
name = "literal"
path = "fuzz_targets/literal.rs"
test = false
doc = false
bench = false

