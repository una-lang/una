# The checks the public tree can run: it builds `una`, and checks formatting and lints. The tests,
# the release scripts and the release gates are kept by the maintainers, who validate and publish
# each release by hand (docs/release-gates.md, docs/validation/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # Compiled dependencies, keyed on the toolchain and Cargo.lock. Only `main` saves, so pull
      # requests restore its cache without adding their own.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Z3 library that `una` links, built once per pin from supply-chain/z3.lock.
      - name: Cache the Z3 library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/una/z3
          key: z3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('supply-chain/z3.lock', 'scripts/build-z3.sh', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Build the Z3 library
        run: echo "UNA_Z3_LIB=$(scripts/z3-library.sh)" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked -p una-cli -p una-rt
