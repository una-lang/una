# Milestone M0, task 5: fmt, clippy and tests on Linux and macOS, with the Z3 release pinned in
# verification.lock installed for the tests that reach tier 1 (compiler/testing.md §3).
#
# The runner rule (D-083, amended by #151 to spare the Actions minutes of the private
# repository):
# - one run per change: `push` triggers only on `main` and on release tags, and a branch is
#   tested by the run of its pull request;
# - Linux runs every time;
# - macOS runs on pushes to `main`, on release tags and on manual runs, and on a pull request
#   only when it touches what differs between the targets: the native backend, its runtime,
#   `una build`, the release scripts, the workflows or `Cargo.lock`;
# - compiled dependencies and the Z3 install are cached, Z3 keyed on verification.lock.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides the runners: macOS joins Linux except on a pull request that touches nothing that
  # differs between the targets.
  runners:
    name: runners
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - name: Find what the pull request touches
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            targets:
              - 'crates/una-codegen/**'
              - 'crates/una-rt/**'
              - 'crates/una-cli/src/build.rs'
              - 'crates/una-cli/src/build/**'
              - 'scripts/release.sh'
              - 'scripts/check-release.sh'
              - '.github/workflows/**'
              - 'Cargo.lock'

      - name: Choose the runners
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          TARGETS: ${{ steps.changes.outputs.targets }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$TARGETS" = true ]; then
            echo 'os=["ubuntu-24.04", "macos-26"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    needs: runners
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.runners.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      # The whole history, with the tags, which the released sections of CHANGELOG.md need.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # Compiled dependencies, keyed on the toolchain and Cargo.lock. Only `main` saves, so pull
      # requests restore its cache without adding their own.
      - name: Cache compiled dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the Z3 release pinned in verification.lock
        id: z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/z3
          key: z3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification.lock', 'scripts/install-z3.sh') }}

      - name: Install the Z3 release pinned in verification.lock
        if: steps.z3.outputs.cache-hit != 'true'
        run: scripts/install-z3.sh "$RUNNER_TEMP/z3"

      - name: Put Z3 on the path
        run: echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"

      - name: Check the solver version
        run: scripts/check-solver.sh

      - name: Released sections of CHANGELOG.md
        run: scripts/check-released-sections.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Each runner packs and checks the release archive of its own target, the targets of the
      # release workflow, whenever it runs (review finding R-035).
      - name: Pack and check the release archive of the runner's target
        run: |
          case "$RUNNER_OS" in
            Linux) target=x86_64-unknown-linux-gnu ;;
            macOS) target=aarch64-apple-darwin ;;
            *) echo "error: no release target for $RUNNER_OS" >&2; exit 1 ;;
          esac
          scripts/release.sh "$target"
          scripts/check-release.sh "$target"
