# NOT USED. GitHub Actions is not used by this project: releases are built and validated on the
# project's own machine by scripts/release-gates.sh and scripts/local-release.sh
# (docs/release-gates.md). This file is kept for reference only and describes what a hosted
# run would do; it is not evidence of anything (#1358).
#
# Milestone M10, task 3: release archives for Linux and macOS, built when a tag v* is pushed and
# attached to a draft release that the project publishes (ADR 0035 rules 3 and 4).
# One native runner per target, with the scripts the CI workflow also runs.
# The project pushes the tag, from main after review; the autonomous run never does.
# Since ADR 0124 step 2 the archive holds `una`, with the Z3 solver and the native runtime built
# into it, the license, the readme and the guides, and no lib/; no Z3 is installed on PATH.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create a draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Una $GITHUB_REF_NAME"
          --notes "The una binary, with the Z3 solver and the native runtime built into it (ADR 0124), with its license, readme and guides, for Linux (x86_64) and macOS (arm64), each with its SHA-256 digest. Nothing else is needed to check and test Una programs; una build still uses the system cc until ADR 0124 step 3."

  build:
    name: ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      # The Z3 library that supply-chain/z3.lock records for the target, which scripts/release.sh
      # embeds into una by its digest (ADR 0124 rules 1 and 18); a target without a recorded
      # digest cannot be released.
      - name: Build the Z3 library recorded in supply-chain/z3.lock
        run: scripts/build-z3.sh --reproducible

      - name: Pack the archive
        run: scripts/release.sh ${{ matrix.target }}

      - name: Check the archive
        run: scripts/check-release.sh ${{ matrix.target }}

      - name: Attach the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          target/release-archives/una-*-${{ matrix.target }}.tar.gz
          target/release-archives/una-*-${{ matrix.target }}.tar.gz.sha256
