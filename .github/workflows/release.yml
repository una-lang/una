# Milestone M10, task 3: release archives for Linux and macOS, built when a tag v* is pushed and
# attached to a draft release that the owner publishes (ADR 0035 rules 3 and 4).
# One native runner per target, with the scripts the CI workflow also runs.
# The owner pushes the tag, from main after review; the autonomous run never does.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create a draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Una $GITHUB_REF_NAME"
          --notes "The una binary with its license and readme, for Linux (x86_64) and macOS (arm64), each with its SHA-256 digest. una checks at tier 1 with Z3 at the version pinned in verification.lock on PATH; scripts/install-z3.sh installs it."

  build:
    name: ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install the Z3 release pinned in verification.lock
        run: |
          scripts/install-z3.sh "$RUNNER_TEMP/z3"
          echo "$RUNNER_TEMP/z3/bin" >> "$GITHUB_PATH"

      - name: Pack the archive
        run: scripts/release.sh ${{ matrix.target }}

      - name: Check the archive
        run: scripts/check-release.sh ${{ matrix.target }}

      - name: Attach the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          target/release-archives/una-*-${{ matrix.target }}.tar.gz
          target/release-archives/una-*-${{ matrix.target }}.tar.gz.sha256
