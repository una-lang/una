[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.14"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/una-lang/una"
publish = false

[workspace.dependencies]
# Workspace crates, in the dependency direction of compiler/architecture.md §2.
una-check = { path = "crates/una-check" }
una-codegen = { path = "crates/una-codegen" }
una-core = { path = "crates/una-core" }
una-diag = { path = "crates/una-diag" }
una-explain = { path = "crates/una-explain" }
una-fmt = { path = "crates/una-fmt" }
una-http = { path = "crates/una-http" }
una-interp = { path = "crates/una-interp" }
una-lsp = { path = "crates/una-lsp" }
una-project = { path = "crates/una-project" }
una-report = { path = "crates/una-report" }
una-rt = { path = "crates/una-rt" }
una-syntax = { path = "crates/una-syntax" }
una-verify = { path = "crates/una-verify" }
# External crates, only from the allowlist of compiler/architecture.md §7.
ariadne = "0.6.0"
cap = "0.1.2"
clap = { version = "4.6.7", features = ["derive"] }
# Allowed by ADR 0055 for una-codegen and una-rt only.
cranelift-codegen = "0.136.1"
cranelift-frontend = "0.136.1"
cranelift-module = "0.136.1"
cranelift-object = "0.136.1"
indexmap = "2.14.2"
insta = "1.48.0"
num-bigint = "0.4.6"
pretty_assertions = "1.4.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.8"
# Allowed by ADR 0055 for una-codegen and una-rt only.
target-lexicon = "0.13.5"
# Allowed by ADR 0074 for una-http only: the TLS stack of the `Http` capability.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# A dev-dependency of una-http only, outside the trusted base: it makes the tests' certificates
# at test time, so the repository holds no private key (N-31).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
toml = "1.1.6"

# The Rust rules of compiler/conventions.md §1, enforced for every target of
# every crate. clippy.toml relaxes them inside tests, which may unwrap freely.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
