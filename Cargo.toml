[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/una-lang/una"
publish = false

[workspace.dependencies]
# Workspace crates, in the dependency direction of compiler/architecture.md §2.
una-check = { path = "crates/una-check" }
una-codegen = { path = "crates/una-codegen" }
una-core = { path = "crates/una-core" }
una-crypto = { path = "crates/una-crypto" }
una-diag = { path = "crates/una-diag" }
una-explain = { path = "crates/una-explain" }
una-fmt = { path = "crates/una-fmt" }
una-hash = { path = "crates/una-hash" }
una-http = { path = "crates/una-http" }
una-interp = { path = "crates/una-interp" }
una-link = { path = "crates/una-link" }
una-lsp = { path = "crates/una-lsp" }
una-project = { path = "crates/una-project" }
una-report = { path = "crates/una-report" }
una-rt = { path = "crates/una-rt" }
una-syntax = { path = "crates/una-syntax" }
una-sys = { path = "crates/una-sys" }
# The case lists of the tests of una-cli (#1652), a dev-dependency only.
una-test-cases = { path = "crates/una-test-cases" }
una-verify = { path = "crates/una-verify" }
una-z3 = { path = "crates/una-z3" }
# External crates, only from the allowlist of compiler/architecture.md §7.
ariadne = "0.6.0"
# Allowed by ADR 0116 Appendix A (amendment of 2026-10-19), for `una-sys` only: Rust
# declarations of the system interface, with no C source built.
libc = "0.2.189"
cap = "0.1.2"
clap = { version = "4.6.7", features = ["derive"] }
# Allowed by ADR 0055 for una-codegen and una-rt only.
cranelift-codegen = "0.136.1"
cranelift-frontend = "0.136.1"
cranelift-module = "0.136.1"
cranelift-object = "0.136.1"
# Allowed by ADR 0124 rule 22 for una-link only: the readers of `ar`, Mach-O and ELF (no writer,
# no compression), already in Cargo.lock through cranelift-object.
object = { version = "0.40.0", default-features = false, features = ["std", "read_core", "archive", "macho", "elf"] }
# Allowed by ADR 0119 for una-hash only: the process key of keyed hashing, from the operating
# system's cryptographic random source.
getrandom = "0.4.3"
indexmap = "2.14.2"
insta = "1.48.0"
pretty_assertions = "1.4.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.8"
# Ed25519 for the registry client (ADR 0122 rule 38): pure Rust, no C, strict verification.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast"] }
# Allowed by ADR 0055 for una-codegen and una-rt only.
target-lexicon = "0.13.5"
# Allowed by ADR 0074 for una-http only: the TLS stack of the `Http` capability. The provider
# (the cryptography under it) is chosen by una-http's features: `ring` (the default for now) or
# the own provider on `una-crypto` (ADR 0133 rule 17), which needs no `ring` and no `cc`.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
# A dev-dependency of una-http only, outside the trusted base: it makes the tests' certificates
# at test time, so the repository holds no private key (N-31).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
toml = "1.1.6"
# Allowed by ADR 0133 for una-crypto only: the wipe of secrets (a volatile write), so the crate
# keeps `unsafe_code` forbidden. Already in the tree through rustls; pure Rust.
zeroize = { version = "1", default-features = false }
# A dev-dependency of una-crypto only (differential tests, ADR 0133 rule 12): the reference the
# own code is compared with until the provider switch removes ring.
ring = { version = "0.17", default-features = false }
# A dev-dependency of una-crypto only: a second independent X25519 for the differential tests.
curve25519-dalek = { version = "4.1", default-features = false }

# The Rust rules of compiler/conventions.md §1, enforced for every target of
# every crate. clippy.toml relaxes them inside tests, which may unwrap freely.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# The tests run the development build of `una` tens of thousands of times, so it is built at
# opt-level 1 (#1697: the full nextest run went from 998 s to 778 s). Debug assertions and overflow
# checks stay on, as at opt-level 0, so the semantics under test are those of every development build.
[profile.dev]
opt-level = 1
# Line tables only: backtraces keep file and line, but the test binaries (about 200, each linked and verified by the operating
# system on first execution) are much smaller: the first execution of a fresh build fell from 119 s to 79 s (#1838).
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

# The crates `una-rt` and `una-http` stay at opt-level 0: tests of `crates/una-cli/tests/http.rs` read
# the symbols that a built program links, and inlining removes names they look for (`Server::stop` at
# opt-level 1; the TLS stack's names when the dependencies are at opt-level 2, so they stay at 1). The
# other crates of the runtime archive `libuna_rt.a` (una-interp, una-sys, una-core, una-hash, cap,
# rustls) build at opt-level 1. The release gates keep opt-level 0: `scripts/sanitize.sh` and
# `scripts/release-gates.sh` export `CARGO_PROFILE_DEV_OPT_LEVEL=0`, and `scripts/local-ci.sh` passes it
# into the container of the Linux legs (0 when unset), which sets the profile-wide value and leaves the
# per-package values below as they are.
[profile.dev.package.una-rt]
opt-level = 0
[profile.dev.package.una-http]
opt-level = 0

# The internal linker reads and hashes the whole runtime archive (tens of MB) on every
# `una build`; the tests build hundreds of executables, so a development build optimizes it and
# the crates it reads and hashes with (ADR 0124 step 3). Behavior is the same at every level.
[profile.dev.package.una-link]
opt-level = 3
[profile.dev.package.object]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
