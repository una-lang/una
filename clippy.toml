# compiler/conventions.md §1: tests may unwrap freely.
allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# compiler/conventions.md §1: library crates never read environment variables.
disallowed-methods = [
    { path = "std::env::var", reason = "library crates never read environment variables (compiler/conventions.md §1)" },
    { path = "std::env::var_os", reason = "library crates never read environment variables (compiler/conventions.md §1)" },
    { path = "std::env::vars", reason = "library crates never read environment variables (compiler/conventions.md §1)" },
    { path = "std::env::vars_os", reason = "library crates never read environment variables (compiler/conventions.md §1)" },
    # No foreign code in Una: away from AArch64, `mul_add` may call the platform C library's
    # `fma`. Una's fused multiply-add is `float::fma` and `dense::fma`; only the AArch64 path,
    # where `mul_add` is the `fmadd` instruction, allows it, scoped and commented.
    { path = "f64::mul_add", reason = "may call the platform C library's fma; use una_core::float::fma, or allow it scoped where it is the AArch64 fmadd instruction" },
    { path = "f32::mul_add", reason = "may call the platform C library's fma; use Una's own exact fma, or allow it scoped where it is the AArch64 fmadd instruction" },
    # The same rule for every other method of f32 and f64 that may lower to a call into the
    # platform C library (libm): Una computes these with its own routines, in tests too. `sqrt`
    # and `abs` stay allowed: they are IEEE instructions or bit operations on every target. A
    # test may compare with these methods only on AArch64, where each is a single instruction,
    # under `#[cfg(target_arch = "aarch64")]` and a scoped, commented allow.
    { path = "f64::floor", reason = "may lower to the platform C library's floor; use una_core's own routine" },
    { path = "f64::ceil", reason = "may lower to the platform C library's ceil; use una_core's own routine" },
    { path = "f64::trunc", reason = "may lower to the platform C library's trunc; use una_core's own routine" },
    { path = "f64::round", reason = "may lower to the platform C library's round; use una_core's own routine" },
    { path = "f64::round_ties_even", reason = "may lower to the platform C library's round_ties_even; use una_core's own routine" },
    { path = "f64::fract", reason = "may lower to the platform C library's fract; use una_core's own routine" },
    { path = "f64::exp", reason = "may lower to the platform C library's exp; use una_core's own routine" },
    { path = "f64::exp2", reason = "may lower to the platform C library's exp2; use una_core's own routine" },
    { path = "f64::exp_m1", reason = "may lower to the platform C library's exp_m1; use una_core's own routine" },
    { path = "f64::ln", reason = "may lower to the platform C library's ln; use una_core's own routine" },
    { path = "f64::ln_1p", reason = "may lower to the platform C library's ln_1p; use una_core's own routine" },
    { path = "f64::log", reason = "may lower to the platform C library's log; use una_core's own routine" },
    { path = "f64::log2", reason = "may lower to the platform C library's log2; use una_core's own routine" },
    { path = "f64::log10", reason = "may lower to the platform C library's log10; use una_core's own routine" },
    { path = "f64::powf", reason = "may lower to the platform C library's powf; use una_core's own routine" },
    { path = "f64::powi", reason = "may lower to the platform C library's powi; use una_core's own routine" },
    { path = "f64::sin", reason = "may lower to the platform C library's sin; use una_core's own routine" },
    { path = "f64::cos", reason = "may lower to the platform C library's cos; use una_core's own routine" },
    { path = "f64::tan", reason = "may lower to the platform C library's tan; use una_core's own routine" },
    { path = "f64::sin_cos", reason = "may lower to the platform C library's sin_cos; use una_core's own routine" },
    { path = "f64::asin", reason = "may lower to the platform C library's asin; use una_core's own routine" },
    { path = "f64::acos", reason = "may lower to the platform C library's acos; use una_core's own routine" },
    { path = "f64::atan", reason = "may lower to the platform C library's atan; use una_core's own routine" },
    { path = "f64::atan2", reason = "may lower to the platform C library's atan2; use una_core's own routine" },
    { path = "f64::sinh", reason = "may lower to the platform C library's sinh; use una_core's own routine" },
    { path = "f64::cosh", reason = "may lower to the platform C library's cosh; use una_core's own routine" },
    { path = "f64::tanh", reason = "may lower to the platform C library's tanh; use una_core's own routine" },
    { path = "f64::asinh", reason = "may lower to the platform C library's asinh; use una_core's own routine" },
    { path = "f64::acosh", reason = "may lower to the platform C library's acosh; use una_core's own routine" },
    { path = "f64::atanh", reason = "may lower to the platform C library's atanh; use una_core's own routine" },
