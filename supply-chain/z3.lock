# The Z3 built into una (ADR 0124 rule 1): the commit of the release tag, pinned by its commit
# hash, its git tree hash and the SHA-256 of a source tarball made from that tree with
# `git archive --format=tar --prefix=z3-<version>/ <commit> | gzip -n -9`. Archives that a
# hosting service generates on request are not used, since their bytes are not promised to stay
# the same. The tarball is mirrored as an asset of the GitHub release `mirror/z3-<version>` of
# una-lang/una, made on the commit that adds this pin; the digest here is the security boundary,
# the release only keeps the bytes available. The recipe is supply-chain/z3/, and
# scripts/build-z3.sh builds it after checking the digest. A test keeps `version` equal to
# verification.lock's solver_version (crates/una-cli/tests/z3_lock.rs).
#
# Provenance, for a reviewer to tie this archive to upstream without trusting the machine that
# made it (checked 2026-10-27). The tarball is the pristine upstream tree: nothing of ours is in
# it, and every change of ours is a patch file under supply-chain/z3/, listed below with its
# digest, that scripts/build-z3.sh applies after the archive's digest check. `commit` is what
# the upstream tag z3-5.1.0 of https://github.com/Z3Prover/z3 points to. That tag is
# lightweight, so it carries no signature; the commit is a merge made on github.com and is
# signed by GitHub's web-flow key (B5690EEEBB952194, committer "GitHub <noreply@github.com>"),
# not by a maintainer's key. The Z3 project publishes no source tarball of its own for the
# release (its z3_solver-5.1.0.0.tar.gz asset is the Python package). To reproduce: in a clone
# of upstream, `git archive --format=tar --prefix=z3-5.1.0/ <commit> | sha256sum` gives
# source_tar_sha256, and `| gzip -n -9 | sha256sum` gives source_sha256 (git 2.46.2, gzip 1.x
# or Apple gzip); and the files of this tarball are byte for byte those of the archive GitHub
# generates on request for the tag, https://github.com/Z3Prover/z3/archive/refs/tags/z3-5.1.0.tar.gz
# (SHA-256 c433e1add0431c5edf1644bd9951c40588024d2d288f0e4215e5fcb6e3b4277d on that day, top
# directory z3-z3-5.1.0/ instead of z3-5.1.0/), whose bytes are not promised to stay the same,
# which is why it is not the pin. Re-importing the files with `git add` does not give `tree`
# back, since upstream's .gitattributes normalizes line endings on import; the archive digest
# is the comparison.
version = "5.1.0"
tag = "z3-5.1.0"
commit = "0b6cdcdbc65da25ef0f73ac9da210574d0f66cf8"
tree = "7fc624d354d92e7e6f38d3a10ba069b8196e3379"
source = "z3-5.1.0.tar.gz"
source_sha256 = "e621ef190d1486759306b83619ffd66ce3ee19cfdb799d17399953e7b0849b75"
# The digest of the uncompressed tar, which no gzip implementation can change.
source_tar_sha256 = "9579acc80f89f03ec04c6a54d468143fb940139b13e901821c335e268ee611b0"
mirror = "https://github.com/una-lang/una/releases/download/mirror/z3-5.1.0/z3-5.1.0.tar.gz"

# Our changes to the source, each a patch file in supply-chain/z3/ with its SHA-256, applied in
# this order by scripts/build-z3.sh after the archive's digest check; a patch whose digest
# differs stops the build. shell-library.patch: the SMT-LIB front end also built as a static
# library with its entry renamed (src/shell/ only, removes nothing).
[patches]
"shell-library.patch" = "16e2806457033cb16efb38b9f7c987a51d466174e23722c999a76538127676a7"

# The SHA-256 of lib/libz3shell.a per target, shown reproducible by two cold builds with equal
# digests (scripts/build-z3.sh --reproducible) and stored in the project's release storage under
# it. Release builds take the library by this digest, so the release and reproducible gates check
# a digest instead of rebuilding Z3; it changes only when the pin or the recipe changes. Each
# target's line is added by the first reproducible build on it, with the toolchain of its
# build record.
[library]
# aarch64-apple-darwin: Apple clang 21.0.0 (clang-2100.4.1.1), cmake 4.4.4, built 2026-10-31,
# shown reproducible by two cold builds with equal digests (scripts/build-z3.sh --reproducible,
# with ZERO_AR_DATE=1, #1277). The digests before it differed only in the archive's member
# headers: the objects were byte for byte equal.
"aarch64-apple-darwin" = "4fcda925f158098beb0edb0650cd98caa0b66215c387f6d165ccf39bd33f0baa"
# aarch64-unknown-linux-gnu: c++ (GCC) 13.3.1 20240611 (Red Hat 13.3.1-2) of gcc-toolset-13,
# cmake version 3.26.5, GNU ar version 2.40-21.el8, glibc 2.28, in the linux/arm64 image of
# scripts/local-ci/Dockerfile.release (almalinux:8@sha256:768bedc3...) as uid 1000, built 2026-11-26
# (#2105), downloaded from the mirror and checked by its digest; shown reproducible by two cold
# builds with equal digests (scripts/build-z3.sh --reproducible, in one fresh cache volume),
# and one more in another fresh volume and container. gcc-toolset's ar does not default to
# deterministic mode, so scripts/build-z3.sh asks GNU ar for it (`qcD`, `ranlib -D`): the member
# headers carry zero owners and times. Reproducible in that image: its packages are not pinned
# by the Dockerfile, so the versions it had are recorded in the table
# toolchain.aarch64-unknown-linux-gnu below, which scripts/release.sh checks (#1926). The
# library of 0.4.0 to 0.5.1, built in the Ubuntu 24.04 image (GCC 13.3.0, glibc 2.39), was
# 0ddec1a9cf5f01e23c96c4c98ad8b6dc7a787f0ecc4ecb975cfb2bf7200e11f7.
"aarch64-unknown-linux-gnu" = "08fdb9fdbec4d6cb83faa6e881403695555fae2a23973f45a23a6154dc004b02"

# The packages of the Linux image that built the library above and that links the release `una`
# (#1926), as `"package" = "VERSION-RELEASE"` from `rpm -q` in the AlmaLinux 8 image of
# scripts/local-ci/Dockerfile.release (#2105, almalinux:8@sha256:768bedc3..., the image built as
# una-local-ci-release:1.98.1-arm64, image ID
# sha256:b5b5c673b32638b2b792a7574bad34c065d8f7d04d519cc3e23508e52f79ddad, with the packages
# installed at these versions, review L2 of #2265), recorded 2026-11-26.
# glibc 2.28 is the floor of install.sh; GCC 13 is gcc-toolset-13's, and libgcc (GCC 8's) is the
# system's libgcc_s.so.1, the unwinder `una` loads. kernel-headers (the Linux headers that
# glibc-headers includes), gcc-toolset-13-runtime (the toolset's environment) and the system's
# binutils 2.30 and libstdc++ (GCC 8's, which the image's cmake and the standalone z3 load; the
# toolset's ld, as and strip come first) are listed so that a drift in any of them is refused
# too (review L4 of #2259); no annobin plugin is installed. Before #2105 the table held the Debian
# packages of the Ubuntu 24.04 image (glibc 2.39, GCC 13.3.0), which built 0.4.0 to 0.5.1.
# The Dockerfile pins its base by digest but installs these with no version, so a rebuild of the
# image after an AlmaLinux update may give others: scripts/release.sh then refuses to build,
# through scripts/check-toolchain.sh (exit 2), when an installed version differs from this table
# or a package is missing, and a new image needs a deliberate update of this table, and a new
# [library] line when the library's digest changes. The table names no target triple, so the
# [library] reader of scripts/release.sh never matches it.
[toolchain.aarch64-unknown-linux-gnu]
"gcc-toolset-13-binutils" = "2.40-21.el8"
"cmake" = "3.26.5-2.el8"
"make" = "4.2.1-11.el8"
"gcc-toolset-13-gcc" = "13.3.1-2.2.el8_10"
"gcc-toolset-13-gcc-c++" = "13.3.1-2.2.el8_10"
"gcc-toolset-13-libstdc++-devel" = "13.3.1-2.2.el8_10"
"libgcc" = "8.5.0-31.el8_10.alma.1"
"glibc" = "2.28-251.el8_10.53"
"glibc-devel" = "2.28-251.el8_10.53"
"glibc-headers" = "2.28-251.el8_10.53"
"kernel-headers" = "4.18.0-553.189.1.el8_10"
"gcc-toolset-13-runtime" = "13.0-2.el8"
"binutils" = "2.30-128.el8_10"
"libstdc++" = "8.5.0-31.el8_10.alma.1"

# The files of those packages that the linker copies, whole or the members it needs, into the
# release `una` on this target (#1958, review L2 of #1957), with their SHA-256: GNU's C++ runtime
# and GCC's runtime, linked statically (`-static-libstdc++ -static-libgcc` and una-z3's
# `static:-bundle=stdc++`), and the start-up objects and libc_nonshared.a of every glibc
# executable, as `ld --trace` lists them for a C++ program linked that way in the image.
# scripts/check-toolchain.sh, which scripts/release.sh runs before `una` is built, finds each by
# `cc -print-file-name=<file>` (`cc` is the driver that links `una`) and refuses (exit 2) a file
# that is missing or whose digest differs; it prints a line
# `toolchain: <target>: <file> sha256 <digest>` for each.
[toolchain-files.aarch64-unknown-linux-gnu]
"libstdc++.a" = "6f2da446d016ae882a595cb55de85b54a8e05d6b180f344252ba097df501228f"
"libgcc.a" = "9519d58f77baf4800cc42c4881a8f54d22d433cc446eb39dc800c73289740273"
"libgcc_eh.a" = "0e00c4711828a7c9ecd3a0f7f266e4ee150accd96a40a9f11784a50e194bb7d6"
"crtbeginS.o" = "79e6b2b2d1034059406a1648204b386e643abb6e78bdacaac72eade5ba509766"
"crtendS.o" = "b8f6d2f1529ea0d7b5f4653111c77718d8cafb189c0ab8155ba8e36ebf3218c1"
"Scrt1.o" = "7ae0bdc5f06b430d9421b407fd32abebafecc5ea8812aadef96ee4f04797d916"
"crti.o" = "004ad70051266e5cc3b05f3ecd8a9f388ce7da43da93bf5a42d8615257c91a3b"
"crtn.o" = "3ab3d63108b001267444acfec36b1eef6de25413c2e5a2cbdce74087f2b947de"
