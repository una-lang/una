# The musl inputs built into a Linux `una` (ADR 0124 rules 12 and 20, step 4a): musl's C library,
# the start-up objects of a static-pie executable and LLVM's libunwind.a, from the self-contained
# directory of each musl target of the Rust toolchain that rust-toolchain.toml pins (the rustup
# component rust-std of that target). These digests are the reference: scripts/release.sh
# refuses a toolchain file whose SHA-256 differs, crates/una-cli/build.rs refuses a digest list
# that differs from this table for the target it builds, scripts/check-release.sh checks that the
# packed `una` carries exactly these digests, and a test of una-link compares the installed
# toolchain's files with them. A bump of the Rust toolchain updates this file deliberately, in
# the same change, after scripts/scan-musl.sh passes on both targets (rule 24).
#
# Rust 1.98.1, musl 1.2.5 (read from libc.a's __libc_version), recorded 2026-11-02.
# Licenses: musl MIT; libunwind Apache-2.0 WITH LLVM-exception.

