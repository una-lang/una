[package]
name = "una-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The unsafe code that the Una runtime and interpreter share: signal handlers, attention words, coroutines, a write-readiness check and the reactor's kqueue or epoll instance (ADR 0116 rule 18, ADR 0117)"

[dependencies]
libc.workspace = true

# The workspace lints, except `unsafe_code`: ADR 0058 (amended by ADRs 0116 and 0117) allows
# `unsafe` in this crate, in the modules that call the operating system or switch stacks:
# `signals.rs`, `coroutine.rs` (Rust `naked_asm!` only, no assembly files, no build script, no C),
# `io.rs` and `poll.rs` (kqueue or epoll, ADR 0117 slice S7), each of which opts in. Every other
# module keeps compiler/conventions.md §1. The crate stays under 1,200 lines, one assembly
# instruction per line (ADR 0116 amendment).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
