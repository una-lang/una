[package]
name = "una-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The unsafe code that calls the operating system: signal handlers, attention words, and descriptor-relative file creation, renaming and removal (ADR 0116 rule 18, ADR 0058 Appendix A, #1094)"

[dependencies]
libc.workspace = true

# The workspace lints, except `unsafe_code`: ADR 0058 (Appendix A of ADR 0116) allows `unsafe`
# in this crate, in the modules that call the operating system, `signals.rs` and `dir.rs`, which
# opt in.
# Every other module keeps the rule of compiler/conventions.md §1.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
