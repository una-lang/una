[package]
name = "una-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The unsafe code that the Una runtime and interpreter share: signal handlers, attention words, coroutines, a write-readiness check and the reactor's kqueue or epoll instance (ADR 0116 rule 18, ADR 0117)"

[dependencies]
libc.workspace = true

[features]
# ADR 0124 rules 7 and 35: the solver child's confinement record, and in later slices its
# confinement, limits, spawn attributes and footprint reading, for `una-cli` and `una-z3` only.
# `una-rt` and `una-interp` never enable it; a test of `una-cli` checks the feature graph.
solver = []

# The workspace lints, except `unsafe_code`: ADR 0058 (amended by ADRs 0116 and 0117) allows
# `unsafe` in this crate, in the modules that call the operating system or switch stacks:
# `signals.rs`, `coroutine.rs` (Rust `naked_asm!` only, no assembly files, no build script, no C),
# `io.rs` and `poll.rs` (kqueue or epoll, ADR 0117 slice S7), `server.rs` (ADR 0123) and, behind
# the feature `solver`, the files of `solver/` (ADR 0124), each of which opts in. Every other
# module keeps compiler/conventions.md §1. The base code stays under its cap of 1,733 lines, which
# `tests/base_size.rs` enforces (ADR 0058, amendment of 2026-11-19), one assembly instruction per
# line (ADR 0116 amendment).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# `una_asan`: set only by scripts/sanitize.sh for its AddressSanitizer builds, and by the fuzz
# flags of scripts/fuzz-targets.sh that scripts/fuzz-smoke.sh uses too, where the coroutine
# switch is announced through the sanitizer's fiber interface (#1145).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(una_asan)"] }

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
