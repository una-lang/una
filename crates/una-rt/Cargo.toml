[package]
name = "una-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The runtime library that every native Una executable links (spec/16, ADR 0055)"

[lib]
# The static library that `una build` links into executables, and an rlib for tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
cap.workspace = true
serde_json.workspace = true
una-core.workspace = true
una-diag.workspace = true
# The keyed hashing of `HashMap` and `HashSet` (ADR 0119 rule 19): SipHash-2-4, the process key and
# the ordered table, one implementation for both engines. Without its `test-hooks` feature.
una-hash.workspace = true
una-http.workspace = true
una-interp.workspace = true
una-sys.workspace = true

[features]
# The toolchain's own test builds only: the scripted serve engine of the runs of
# `tests/serve_runs/` (ADR 0123 rule 21), which a run whose environment names a case serves in
# place of listeners (`serve::script`). It compiles una-http's test hooks, whose marker
# scripts/check-release.sh refuses in a shipped `libuna_rt.a`.
test-hooks = ["una-http/test-hooks"]

# The tests of the request pool use the test-only hooks of una-http (#1148); a dev-dependency
# never reaches the shipped `libuna_rt.a`.
[dev-dependencies]
una-http = { workspace = true, features = ["test-hooks"] }

# The workspace lints, except `unsafe_code`: ADR 0058 allows `unsafe` in one module, the
# C ABI boundary of `ffi.rs`, which the generated code calls. `deny` lets that module opt in;
# every other module keeps the rule of compiler/conventions.md §1.
[lints.rust]
unsafe_code = "deny"
# `una_fuzz`: set only by scripts/sanitize.sh and scripts/fuzz-smoke.sh, through the flags of
# scripts/fuzz-targets.sh, for the fuzz targets of `fuzz/` (#766, #1430).
# `una_asan`: set only by scripts/sanitize.sh for its AddressSanitizer builds; here it only
# skips the timing of one scaling test, whose count still runs (#2124).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(una_fuzz)", "cfg(una_asan)"] }

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
