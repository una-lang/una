[package]
name = "una-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The runtime library that every native Una executable links (spec/16, ADR 0055)"

[lib]
# The static library that `una build` links into executables, and an rlib for tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
cap.workspace = true
num-bigint.workspace = true
serde_json.workspace = true
una-core.workspace = true
una-diag.workspace = true
una-http.workspace = true
una-interp.workspace = true

# The workspace lints, except `unsafe_code`: ADR 0058 allows `unsafe` in one module, the
# C ABI boundary of `ffi.rs`, which the generated code calls. `deny` lets that module opt in;
# every other module keeps the rule of compiler/conventions.md §1.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
