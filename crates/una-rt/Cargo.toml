[package]
name = "una-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The runtime library that every native Una executable links (spec/16, ADR 0055)"

[lib]
# The static library that `una build` links into executables, and an rlib for tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
cap.workspace = true
num-bigint.workspace = true
serde_json.workspace = true
una-core.workspace = true
una-diag.workspace = true
una-http.workspace = true
una-interp.workspace = true
una-sys.workspace = true

# The tests of the request pool use the test-only hooks of una-http (#1148); a dev-dependency
# never reaches the shipped `libuna_rt.a`.
[dev-dependencies]
una-http = { workspace = true, features = ["test-hooks"] }

# The workspace lints, except `unsafe_code`: ADR 0058 allows `unsafe` in one module, the
# C ABI boundary of `ffi.rs`, which the generated code calls. `deny` lets that module opt in;
# every other module keeps the rule of compiler/conventions.md §1.
[lints.rust]
unsafe_code = "deny"
# `una_fuzz`: set only by scripts/sanitize.sh for the fuzz targets of `fuzz/` (#766).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(una_fuzz)"] }

[lints.clippy]
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
